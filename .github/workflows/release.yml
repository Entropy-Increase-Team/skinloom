name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  bundles:
    name: Release bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build bundles
        run: |
          VERSION="${GITHUB_REF_NAME#v}" bash deploy/packaging/package.sh \
            windows/amd64 windows/arm64 darwin/amd64 darwin/arm64 linux/amd64 linux/arm64
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/checksums.txt

  images:
    name: Docker images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - { name: skinloom, file: deploy/docker/all-in-one.Dockerfile }
          - { name: server, file: deploy/docker/server.Dockerfile }
          - { name: web, file: deploy/docker/web.Dockerfile }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/entropy-increase-team/${{ matrix.image.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.image.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
