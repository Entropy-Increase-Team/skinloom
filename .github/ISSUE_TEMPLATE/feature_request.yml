name: 功能建议 / Feature request
description: 提出新功能或改进 / Suggest a feature
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / Problem
      description: 你在做什么、遇到了什么困难 / What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的方案 / Proposal
  - type: dropdown
    id: plugin
    attributes:
      label: 是否适合做成插件 / Could this be a plugin?
      options: [不确定, 适合做成插件, 应该内置]
