apiVersion: apps/v1
kind: Deployment
metadata:
  name: skinloom
spec:
  replicas: 1 # SQLite on a ReadWriteOnce volume: one pod; use the "split" variant to scale
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: skinloom
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: skinloom
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # "node" in the image
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: skinloom
          image: ghcr.io/entropy-increase-team/skinloom
          args: ["up"]
          ports:
            - name: http
              containerPort: 17546
          env:
            - name: TZ
              value: Asia/Shanghai
            # Requests arrive through the ingress controller; believe the
            # X-Forwarded-* headers it sets. 10.42.0.0/16 is the k3s pod network;
            # use your cluster's pod CIDR elsewhere.
            - name: SKINLOOM_SERVER__TRUSTED_PROXIES
              value: 10.42.0.0/16
          volumeMounts:
            - name: data
              mountPath: /data
          startupProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 60 # migrations and the first frontend start
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: skinloom-data
