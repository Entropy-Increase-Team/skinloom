# Frontend (Next.js). Stateless, scale freely:
#   kubectl -n skinloom scale deploy/skinloom-web --replicas=3
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skinloom-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/instance: skinloom-web
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: skinloom-web
        app.kubernetes.io/name: skinloom-web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # "node" in the image
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/entropy-increase-team/web
          ports:
            - name: http
              containerPort: 17547
          env:
            - name: TZ
              value: Asia/Shanghai
            - name: SKINLOOM_API_INTERNAL
              value: http://skinloom-server:17546
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: skinloom-web
spec:
  selector:
    app.kubernetes.io/instance: skinloom-web
  ports:
    - name: http
      port: 17547
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: skinloom-web
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: skinloom-web
