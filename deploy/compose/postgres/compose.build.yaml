# Local source build override (used inside a git checkout or deploy-smoke CI):
#   docker compose -f deploy/compose/postgres/compose.yaml -f deploy/compose/postgres/compose.build.yaml up -d --build
services:
  server:
    build:
      context: ../../..
      dockerfile: deploy/docker/server.Dockerfile
  web:
    build:
      context: ../../..
      dockerfile: deploy/docker/web.Dockerfile
