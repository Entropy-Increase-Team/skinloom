# Production-style setup: backend and frontend in separate containers, MariaDB.
#
#   cp .env.example .env          # set DB_PASSWORD (and optionally the rest)
#   docker compose up -d
#   docker compose logs server | grep setup   # one-time setup link (first start)
#   → http://localhost:17546
#
# The backend is the single public entry point; it proxies page requests to the
# frontend container (web.mode = external). Scale the frontend with
#   docker compose up -d --scale web=2
name: skinloom

services:
  server:
    image: ghcr.io/entropy-increase-team/server:${SKINLOOM_VERSION:-latest}
    build: # used only when the image cannot be pulled (e.g. before the first release)
      context: ../../..
      dockerfile: deploy/docker/server.Dockerfile
    command: ["up"]
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      SKINLOOM_DATABASE__DRIVER: mysql
      SKINLOOM_DATABASE__DSN: skinloom:${DB_PASSWORD:?set DB_PASSWORD in .env}@tcp(db:3306)/skinloom
      SKINLOOM_WEB__MODE: external
      SKINLOOM_WEB__URL: http://web:17547
    ports:
      - "${SKINLOOM_PORT:-17546}:17546"
    volumes:
      - data:/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: ghcr.io/entropy-increase-team/web:${SKINLOOM_VERSION:-latest}
    build:
      context: ../../..
      dockerfile: deploy/docker/web.Dockerfile
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      SKINLOOM_API_INTERNAL: http://server:17546
    restart: unless-stopped

  db:
    image: mariadb:11.4
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MARIADB_DATABASE: skinloom
      MARIADB_USER: skinloom
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  data:
  db:
