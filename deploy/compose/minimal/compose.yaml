# Smallest setup: one container (backend + frontend), SQLite and uploads in a volume.
# Good for personal and small sites; everything lives in the "data" volume.
#
#   docker compose up -d
#   docker compose logs skinloom | grep setup   # one-time setup link (first start)
#   → http://localhost:17546
#
# Pin a release with SKINLOOM_VERSION=1.1.4 (default: latest release; "edge" = main).
# Pulls from Docker Hub by default; to use GHCR instead, set:
#   SKINLOOM_IMAGE=ghcr.io/entropy-increase-team/skinloom
# Behind a host reverse proxy (Nginx/Caddy/1Panel), set SKINLOOM_BIND=127.0.0.1.
name: skinloom

services:
  skinloom:
    image: ${SKINLOOM_IMAGE:-dnyo666/skinloom}:${SKINLOOM_VERSION:-latest}
    ports:
      - "${SKINLOOM_BIND:-0.0.0.0}:${SKINLOOM_PORT:-17546}:17546"
    volumes:
      - data:/data
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    restart: unless-stopped

volumes:
  data:
